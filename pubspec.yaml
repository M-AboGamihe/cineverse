name: movie_app
description: "CineVerse — movie discovery with TMDB, Firebase, and Clean Architecture."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9

  # Splash
  flutter_native_splash: ^2.4.7

  # Firebase
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8

  # Networking
  dio: ^5.9.2

  # Functional programming
  dartz: ^0.10.1

  # DI
  get_it: ^9.2.1

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Shared prefs
  shared_preferences: ^2.5.5

  cached_network_image: ^3.4.1

  # Video
  youtube_player_flutter: ^9.1.3
  bloc_concurrency: ^0.3.0
  url_launcher: ^6.3.2
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4

  # Hive codegen (if you add type adapters with annotations)
  hive_generator: ^2.0.1
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/splash/startup_splash.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/icons/app_icon.png
    background_color: "#000000"
    theme_color: "#E50914"

flutter_native_splash:
  color: "#000000"
  image: assets/splash/startup_splash.png
  branding: assets/splash/logo.png
  fullscreen: true

  android_12:
    color: "#000000"
    image: assets/splash/startup_splash.png